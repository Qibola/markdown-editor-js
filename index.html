<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Markdown Editor</h1>
    <p class="stats" id="stats">0 words · 0 characters</p>
  </header>
  <main class="panes">
    <section class="pane">
      <h2>Markdown</h2>
      <textarea id="editor" spellcheck="false" placeholder="Type some Markdown…"># Hello

Start writing **Markdown** here — *emphasis*, `code` and [links](https://example.com) all work.

- lists
- too

```js
console.log("fenced code");
```</textarea>
    </section>
    <section class="pane">
      <h2>Preview</h2>
      <div id="preview" class="preview"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
